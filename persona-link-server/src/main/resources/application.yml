server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: persona-link-server
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/persona_link?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
app:
  analytics:
    event-retention-days: ${PERSONA_LINK_ANALYTICS_RETENTION_DAYS:30}
  deepseek:
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
    api-key: ${DEEPSEEK_API_KEY:}
    model: ${DEEPSEEK_MODEL:deepseek-v4-flash}
    connect-timeout-millis: ${DEEPSEEK_CONNECT_TIMEOUT_MILLIS:10000}
    read-timeout-millis: ${DEEPSEEK_READ_TIMEOUT_MILLIS:120000}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    com.personalink.server.mapper: DEBUG
