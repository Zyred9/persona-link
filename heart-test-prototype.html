<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>心动测测 · 可点击交互原型</title>
  <style>
    :root {
      --ink: #27231f;
      --muted: #756e67;
      --paper: #f8f2e8;
      --paper-2: #fffdf8;

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {

      background-size: 18px 18px, 23px 23px;
    }
    button, input, textarea { font: inherit; }
    button { border: 0; cursor: pointer; color: inherit; }
    .workspace { min-height: 100vh; display: flex; justify-content: center; align-items: center; gap: 26px; padding: 26px; }
    .phone {

      border: 9px solid #302c28; border-radius: 38px; background: var(--paper); box-shadow: 0 30px 70px rgba(41,28,17,.35), inset 0 0 0 1px rgba(255,255,255,.3);
    }
    .phone::before { content: ""; position: absolute; width: 122px; height: 25px; z-index: 40; left: 50%; top: 8px; transform: translateX(-50%); border-radius: 16px; background: #302c28; }
    #app { height: 100%; overflow: hidden; background: var(--paper); }
    .screen { height: 100%; display: flex; flex-direction: column; animation: lift .24s ease both; }
    @keyframes lift { from { opacity: .2; transform: translateX(12px); } to { opacity: 1; transform: none; } }
    .scroll { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding: 15px 18px 100px; }
    .scroll::-webkit-scrollbar { display: none; }
    .topbar { height: 63px; padding: 25px 16px 7px; display: flex; align-items: center; justify-content: space-between; flex: 0 0 auto; }
    .topbar h1 { margin: 0; font: 700 18px var(--serif); letter-spacing: .03em; }
    .topbar .side { width: 34px; height: 30px; display: flex; align-items: center; justify-content: center; }
    .icon-btn { width: 32px; height: 32px; display: grid; place-items: center; background: transparent; border-radius: 50%; font-size: 22px; line-height: 1; }
    .icon-btn:active, .ghost:active { background: rgba(39,35,31,.07); }

    .eyebrow i { width: 8px; height: 8px; display: inline-block; background: var(--red); border-radius: 50%; }
    .display { font: 700 30px/1.18 var(--serif); letter-spacing: -.04em; margin: 7px 0 5px; }

    .btn:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--red-dark); }

    .btn.ink { background: var(--ink); box-shadow: 0 5px 0 #111; }

    .nav-icon { font-size: 19px; line-height: 1; }

    .category.active { background: var(--ink); color: #fff; }

    @keyframes shimmer { to { transform: translateX(100%); } }

    .empty-mark { width: 74px; height: 74px; margin-bottom: 14px; display: grid; place-items: center; border-radius: 50%; background: #f1e5d5; font: 37px var(--serif); color: #a06d4c; }

    .detail-cover { min-height: 199px; margin: 5px 0 16px; position: relative; overflow: hidden; display: grid; place-items: center; border-radius: 22px; font: 75px var(--serif); }
    .detail-cover.work { background: #f5ce76; color: #5b3c2d; } .detail-cover.x { background: #bcd7d5; color: #24534d; } .detail-cover.pair { background: #e7cdd0; color: #853c43; }

    .option .letter { width: 25px; height: 25px; flex: 0 0 auto; border-radius: 50%; display: grid; place-items: center; background: #f2e7d9; color: #866b53; font-size: 11px; font-weight: 800; }
    .option.selected { border-color: var(--red); background: #fff2ea; color: var(--red-dark); } .option.selected .letter { background: var(--red); color: white; }
    .quiz-foot { padding: 9px 18px 26px; display: flex; justify-content: space-between; align-items: center; }
    .quiz-foot .text-btn { color: var(--muted); }
    .result-banner { position: relative; overflow: hidden; padding: 24px 19px 19px; color: #fffaf0; border-radius: 22px; background: #3c5650; box-shadow: 0 13px 24px rgba(47,69,61,.2); }
    .result-banner::after { content: "✦"; position: absolute; right: 8px; bottom: -45px; color: #f7d36e; font: 130px var(--serif); }
    .result-banner h2 { position: relative; z-index: 1; margin: 5px 0 7px; font: 700 28px var(--serif); }
    .result-banner p { position: relative; z-index: 1; margin: 0; max-width: 245px; color: #dbe8dd; font-size: 12px; line-height: 1.65; }
    .result-section { margin-top: 19px; } .result-section h3 { margin: 0 0 8px; font: 700 16px var(--serif); }
    .dimension { padding: 13px; background: var(--paper-2); border: 1px solid var(--line); border-radius: 15px; }
    .dimension-row { display: grid; grid-template-columns: 68px 1fr 28px; align-items: center; gap: 8px; font-size: 11px; margin: 9px 0; }
    .dimension-bar { height: 7px; overflow: hidden; background: #eee4d6; border-radius: 99px; } .dimension-bar i { display: block; height: 100%; background: var(--orange); border-radius: inherit; }
    .deep { overflow: hidden; position: relative; padding: 17px; border: 1px dashed #dcb691; border-radius: 18px; background: #fff5e9; }

    .invite-code { padding: 19px; text-align: center; }

    .pair-people { display: flex; align-items: center; justify-content: center; gap: 14px; margin: 12px 0 15px; }

    .person.ta { background: #b7d5ce; color: #265b52; transform: rotate(4deg); } .link { color: var(--red); font-size: 20px; }
    .record-tabs { display: flex; gap: 7px; margin-bottom: 16px; padding: 4px; border-radius: 14px; background: #f0e5d6; }

</head>
<body>
  <main class="workspace">
    <section class="phone" aria-label="心动测测手机端交互原型"><div id="app"></div><div class="toast" id="toast"></div></section>
    <aside class="lab" id="lab" aria-label="原型状态控制台">
      <h1>心动测测</h1><p>原型控制台 · 不属于小程序正式界面</p>
      <h2>用户身份</h2><div class="lab-grid"><button data-lab-role="visitor">游客</button><button data-lab-role="free">非会员</button><button data-lab-role="member">会员</button></div>
      <h2>完整流程</h2><div class="lab-grid"><button data-lab-screen="consent">首次协议</button><button data-lab-screen="home">首页</button><button data-lab-screen="detail" data-lab-test="work">单人测试</button><button data-lab-screen="detail" data-lab-test="pair">双人测试</button><button data-lab-screen="pairjoin">受邀加入</button><button data-lab-screen="history">测试记录</button><button data-lab-screen="profile">我的</button><button data-lab-screen="settings">设置</button></div>
      <h2>关键状态</h2><div class="lab-grid"><button data-lab-state="consent-failure">协议加载失败</button><button data-lab-state="home-loading">首页加载</button><button data-lab-state="home-failure">首页失败</button><button data-lab-state="home-empty">首页空态</button><button data-lab-state="detail-offline">题型不可用</button><button data-lab-state="history-empty">记录空态</button><button data-lab-state="history-failure">记录失败</button><button data-lab-state="offline">网络异常</button><button data-lab-state="answer-offline">答题断网</button><button data-lab-state="ad-fail">广告失败</button><button data-lab-state="permission">相册拒绝</button><button data-lab-state="content-offline">结果已下线</button><button data-lab-state="payment-fail">支付失败</button><button data-lab-state="feedback-failure">反馈失败</button><button data-lab-state="pair-invalid">配对码无效</button><button data-lab-state="pair-used">配对码已用</button><button data-lab-state="pair-version">版本不一致</button><button data-lab-state="pair-expired">配对失效</button><button data-lab-state="pair-report-fail">报告生成失败</button><button data-lab-state="reset" class="wide">恢复正常状态</button></div>
      <div class="legend">每一个状态都可由正式流程中的操作触发；控制台仅用于评审快速跳转。游客基础测试不受登录/会员拦截；会员只在深度区免激励。</div>
    </aside>
    <button class="demo-tab" data-action="toggle-lab">调试</button>
  </main>
  <script>
    const app = document.getElementById('app');
    const toastEl = document.getElementById('toast');
    const lab = document.getElementById('lab');
    const tests = {
      work: { id: 'work', type: 'single', title: '你是哪种牛马性格测试？', tag: '职场趣测', count: 22, time: '约 3 分钟', icon: '牛', cover: 'work', audience: '想用轻松视角看看自己协作方式的人', result: '认真小狗型' },
      x: { id: 'x', type: 'single', title: '你的 X 偏好？', tag: '趣味偏好', count: 20, time: '约 3 分钟', icon: 'X', cover: 'x', audience: '喜欢探索当下偏好的人', result: '你的 X 偏好结果' },
      pair: { id: 'pair', type: 'pair', title: '双人关系角色测试', tag: '双人独立作答', count: 30, time: '每人约 4 分钟', icon: '合', cover: 'pair', audience: '情侣、暧昧或想了解相处方式的两个人', result: '默契搭子' }
    };
    const state = {
      screen: 'consent', stack: [], role: 'visitor', selected: tests.work,
      quizIndex: 0, answers: {}, isLastSelected: false, fault: null, pairStatus: 'INITIATOR_DONE',
      recordTab: 'single', deepUnlocked: false, adOutcome: 'success', posterDenied: false,
      feedbackText: '', reportDeleted: false, pairDeleted: false, submittedFeedback: false,
      consented: false, activeCategory: '全部', activePlan: 'monthly', memberOrigin: 'profile', feedbackSubmitting: false
    };
    const roleLabel = () => state.role === 'visitor' ? '游客' : state.role === 'free' ? '已识别 · 非会员' : '心动会员';
    const isMember = () => state.role === 'member';
    function go(screen, opts = {}) { if (!opts.replace) state.stack.push(state.screen); state.screen = screen; if (opts.selected) state.selected = tests[opts.selected] || state.selected; if (opts.resetQuiz) { state.quizIndex = 0; state.answers = {}; state.isLastSelected = false; } render(); }
    function back(fallback = 'home') { state.screen = state.stack.pop() || fallback; render(); }
    function toast(text) { toastEl.textContent = text; toastEl.classList.add('show'); clearTimeout(window.toastTimer); window.toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2200); }
    function modal(content, type = 'sheet') { return `<div class="overlay" data-overlay="close"><div class="${type}">${content}</div></div>`; }
    function topbar(title, opts = {}) { return `<header class="topbar"><div class="side">${opts.back ? `<button class="icon-btn" data-action="back" aria-label="返回">‹</button>` : ''}</div><h1>${title}</h1><div class="side">${opts.right || ''}</div></header>`; }
    function bottomNav(active) { return `<nav class="bottom-nav"><button class="nav-item ${active === 'home' ? 'active' : ''}" data-action="home"><span class="nav-icon">⌂</span><span>首页</span></button><button class="nav-item ${active === 'profile' ? 'active' : ''}" data-action="profile"><span class="nav-icon">◖</span><span>我的</span></button></nav>`; }
    function homeCards() { return `<div class="test-grid"><button class="test-card" data-action="detail" data-test="work"><div class="art work">牛</div><span class="tag">${tests.work.tag}</span><strong>${tests.work.title}</strong><span class="count">${tests.work.count} 题 · 单人</span></button><button class="test-card" data-action="detail" data-test="x"><div class="art x">X</div><span class="tag">${tests.x.tag}</span><strong>${tests.x.title}</strong><span class="count">${tests.x.count} 题 · 单人</span></button></div>`; }
    function renderHome() {
      const f = state.fault;
      if (f === 'home-loading') return `<div class="screen">${topbar('心动测测', { right: `<button class="icon-btn" data-action="profile">◖</button>` })}<div class="home-hero"><div class="eyebrow"><i></i>今日刚好适合认识自己</div><h1 class="display">把此刻的你，<br>收进一张小卡片。</h1></div><div class="skeleton hero"></div><div class="section"><div class="skeleton card"></div></div>${bottomNav('home')}</div>`;
      if (f === 'home-failure') return `<div class="screen">${topbar('心动测测', { right: `<button class="icon-btn" data-action="profile">◖</button>` })}<div class="error-card paper-card"><div class="error-icon">⌁</div><h2>内容暂时没赶上来</h2><p>运营位加载失败，已保留安全兜底。请检查网络后重新加载。</p><button class="btn" data-action="retry-home">重新加载</button></div>${bottomNav('home')}</div>`;
      if (f === 'home-empty') return `<div class="screen">${topbar('心动测测', { right: `<button class="icon-btn" data-action="profile">◖</button>` })}<div class="empty"><div class="empty-mark">✦</div><h2>暂时没有可用测试</h2><p>内容正在更新中。这里不会用广告替代内容。</p><button class="btn" data-action="retry-home">刷新一下</button></div>${bottomNav('home')}</div>`;
      return `<div class="screen">${topbar('心动测测', { right: `<button class="icon-btn" data-action="profile">◖</button>` })}<div class="scroll" style="padding:0 0 92px"><div class="home-hero"><div class="eyebrow"><i></i>今日刚好适合认识自己</div><h1 class="display">把此刻的你，<br>收进一张小卡片。</h1></div>${state.fault === 'offline' ? `<div class="warning-bar">⌁ 网络不稳定，已展示本地安全内容 <button class="text-btn" data-action="retry-home">重试</button></div>` : ''}<section class="banner"><div class="mini">双人独立作答 · 不看对方答案</div><h2>你和 TA，<br>是哪种相处搭子？</h2><button data-action="detail" data-test="pair">和 TA 一起测 →</button></section><section class="section"><div class="section-title"><h3>${state.activeCategory==='全部'?'热门推荐':state.activeCategory+' · 推荐'}</h3></div>${homeCards()}</section><section class="section"><div class="section-title"><h3>常青分类</h3></div><div class="category-row"><button class="category ${state.activeCategory==='全部'?'active':''}" data-action="category-filter" data-category="全部">全部</button><button class="category ${state.activeCategory==='职场协作'?'active':''}" data-action="category-filter" data-category="职场协作">职场协作</button><button class="category ${state.activeCategory==='相处方式'?'active':''}" data-action="category-filter" data-category="相处方式">相处方式</button><button class="category ${state.activeCategory==='日常偏好'?'active':''}" data-action="category-filter" data-category="日常偏好">日常偏好</button></div></section><section class="section"><div class="section-title"><h3>双人测试</h3><button data-action="detail" data-test="pair">更多 ›</button></div><button class="test-card wide" data-action="detail" data-test="pair"><div><span class="pill">每人 ${tests.pair.count} 题</span><strong>${tests.pair.title}</strong><span class="count">独立作答后，查看一份相处参考报告</span></div></button></section></div>${bottomNav('home')}</div>`;
    }
    function renderConsent() { if (state.fault === 'consent-failure') return `<div class="screen"><div class="error-card paper-card" style="margin-top:150px"><div class="error-icon">⌁</div><h2>协议暂时无法加载</h2><p>尚未同意前不会初始化非必要能力，也不会进入测试。请重新加载后再继续。</p><button class="btn" data-action="retry-consent">重新加载</button></div></div>`; return `<div class="screen"><div class="scroll" style="padding-top:105px"><div class="eyebrow"><i></i>心动测测</div><h1 class="display" style="font-size:38px">先说好，<br>再一起玩。</h1><div class="note" style="margin:30px 0 22px"><b style="font-family:var(--serif)">这是娱乐测试，不是判断。</b><p class="subtitle" style="margin-top:7px">结果只供娱乐和自我了解参考，不构成心理、医疗、婚恋或职业建议。</p></div><p class="disclaimer">继续前，请阅读并同意 <button class="text-btn" data-action="agreement" data-doc="用户协议">《用户协议》</button>、<button class="text-btn" data-action="agreement" data-doc="隐私保护指引">《隐私保护指引》</button> 与 <button class="text-btn" data-action="agreement" data-doc="娱乐测试免责声明">《娱乐测试免责声明》</button>。</p></div><div class="detail-bottom"><button class="btn" data-action="accept-consent">同意并继续</button><button class="text-btn" style="width:100%;margin-top:9px" data-action="decline-consent">不同意并退出</button></div></div>`; }
    function renderAgreement() { const doc = state.doc || '用户协议'; return `<div class="screen">${topbar(doc, { back:true })}<div class="scroll"><h2 class="display" style="font-size:25px">${doc}</h2><p class="subtitle">原型展示协议阅读入口与返回逻辑。正式版本将渲染已发布的协议版本，并在版本变更后重新确认。</p><div class="divider"></div><p class="subtitle">我们仅处理完成服务所需的匿名标识、答题选项、题型版本、测试时间、权益状态和必要诊断信息。不会申请通讯录、定位、相机或麦克风。</p><div class="note" style="margin-top:22px">双人测试只呈现双方的聚合报告；不会向对方展示你的逐题答案、昵称、头像或设备资料。</div></div></div>`; }
    function renderDetail() { const t = state.selected; const unavailable = state.fault === 'detail-offline'; return `<div class="screen">${topbar('测试详情', {back:true})}<div class="scroll"><div class="detail-cover ${t.cover}">${t.type === 'pair' ? '我×TA' : t.icon}</div><div class="meta-row"><span class="pill">${t.tag}</span><span class="pill">${t.count} 题</span><span class="pill">${t.time}</span></div><h1 class="display" style="font-size:27px">${t.title}</h1><p class="subtitle">适合 ${t.audience}</p>${unavailable ? `<div class="note" style="margin-top:18px">题型状态校验失败，请检查网络后刷新。当前不会创建答题草稿。</div>` : `<div class="step-row">${t.type === 'pair' ? `<div class="step"><b>1. 你先作答</b>完成自己的 30 道题</div><div class="step"><b>2. 邀请 TA</b>发一份一人一码的配对邀请</div><div class="step"><b>3. 一起查看</b>生成独立的相处报告</div>` : `<div class="step"><b>一题一屏</b>选择后自动进入下一题</div><div class="step"><b>基础结果免费</b>无需登录、广告或会员</div><div class="step"><b>随时退出</b>可暂存或放弃本次作答</div>`}</div>`}<div class="divider"></div><p class="disclaimer">仅供娱乐与自我了解参考，不构成心理、医疗、婚恋或职业建议。${t.type === 'pair' ? '双方独立作答，默认不展示彼此单题答案。' : ''}</p></div><div class="detail-bottom"><button class="btn" data-action="start-test" ${unavailable ? 'disabled':''}>${unavailable ? '题型暂不可用' : t.type === 'pair' ? '和 TA 一起测' : '开始测试'}</button>${unavailable ? `<button class="text-btn" style="width:100%;margin-top:8px" data-action="retry-detail">重新校验</button>` : ''}</div></div>`; }
    function renderQuiz() { const t = state.selected, n = state.quizIndex + 1, final = n === t.count; const selected = state.answers[n]; const offline = state.fault === 'offline-answer'; const text = t.type === 'pair' ? `第 ${n} 道相处偏好题` : `第 ${n} 道题目`; const optionTexts = ['更符合此刻的我', '要看具体情境', '我通常会选另一种方式', '暂时没有明显偏好']; return `<div class="screen">${topbar(t.type === 'pair' ? '我先来答' : '单人测试', {back:true, right:`<button class="text-btn" data-action="exit-quiz">退出</button>`})}<div class="quiz-head"><div class="quiz-title"><span>${n} / ${t.count}</span><span>${t.type === 'pair' ? '双人独立作答' : '单选题'}</span></div><div class="progress-line"><span style="width:${(n/t.count*100).toFixed(1)}%"></span></div></div>${offline ? `<div class="warning-bar">⌁ 网络已断开，选项已暂存在本机 <button class="text-btn" data-action="restore-network">恢复后继续</button></div>` : ''}<div class="quiz-body"><div class="q-label">${text}</div><h1 class="question">题目内容由后台题库配置<br>请选择最符合你的选项</h1><div>${optionTexts.map((x,i)=>`<button class="option ${selected===i?'selected':''}" data-action="answer" data-option="${i}"><span class="letter">${'ABCD'[i]}</span><span>${x}</span></button>`).join('')}</div></div><div class="quiz-foot"><button class="text-btn" data-action="previous-question" ${n===1?'style="visibility:hidden"':''}>‹ 上一题</button>${final ? `<button class="btn small" data-action="submit-quiz" ${selected===undefined?'disabled':''}>提交并查看结果</button>` : `<span style="color:var(--muted);font-size:11px">选择后自动下一题</span>`}</div></div>`; }
    function renderResult() { const t = state.selected; const locked = !state.deepUnlocked && !isMember(); const title = t.type === 'pair' ? '默契搭子' : t.result; const isPair = t.type === 'pair'; if (state.fault === 'content-offline') return `<div class="screen">${topbar(isPair ? '双人报告' : '测试结果', {back:true})}<div class="error-card paper-card" style="margin-top:120px"><div class="error-icon">⌁</div><h2>内容已下线</h2><p>因内容策略或风险处理，此报告当前不可继续展示或分享。你可以返回测试记录查看其他报告。</p><button class="btn" data-action="history">返回测试记录</button></div></div>`; return `<div class="screen">${topbar(isPair ? '双人报告' : '测试结果', {back:true, right:`<button class="icon-btn" data-action="share">⌁</button>`})}<div class="scroll"><section class="result-banner"><div class="eyebrow" style="color:#d7e7da"><i style="background:#f7d36e"></i>${isPair ? '双人关系角色测试' : t.title}</div><h2>${title}</h2><p>${isPair ? '你们会在具体行动里慢慢建立默契，也愿意把彼此的感受放进计划。' : '你认真对待协作，也愿意把承诺落成看得见的行动。'}</p></section><section class="result-section"><h3>基础结果</h3><div class="dimension"><div class="dimension-row"><span>行动感</span><div class="dimension-bar"><i style="width:76%"></i></div><b>76</b></div><div class="dimension-row"><span>共情感</span><div class="dimension-bar"><i style="width:68%;background:var(--green)"></i></div><b>68</b></div><div class="dimension-row"><span>表达感</span><div class="dimension-bar"><i style="width:58%;background:var(--blue)"></i></div><b>58</b></div></div><p class="subtitle" style="margin-top:10px">${isPair ? '共同点、差异点和小建议只呈现聚合内容，不包含任何一方的单题答案。' : '试着把“我会负责”换成更可见的分工和截止时间，合作会更轻松。'}</p></section><section class="result-section deep ${locked?'locked':''}"><span class="pill ${locked?'lock':'green'}">${locked?'⌁ 深度解析':'✓ 已解锁'}</span><h3 style="margin-top:8px">${isPair ? '把默契用在日常里' : '更适合你的协作节奏'}</h3><p>${locked ? '场景化解析、可讨论话题和主题结果卡，等待你主动解锁。' : '当你们对一件事有分歧时，先对齐“我们各自最在意什么”，再一起决定下一步。'}</p>${locked ? `<div class="deep-actions"><button class="btn" data-action="unlock-ad">观看视频解锁</button><button class="btn alt" data-action="member">开通会员</button></div>` : ''}</section><div class="action-strip"><button data-action="share"><span>⌁</span>分享</button><button data-action="save-poster"><span>▣</span>保存海报</button>${isPair ? `<button data-action="pair-another"><span>＋</span>再配一位</button>` : `<button data-action="retest"><span>↻</span>再测一次</button>`}</div><p class="disclaimer">仅供娱乐与自我了解参考，不构成心理、医疗、婚恋或职业建议。</p></div>${!isPair ? `<div class="detail-bottom"><button class="btn alt" data-action="home">返回首页</button></div>` : ''}</div>`; }
    function renderPairInvite() { return `<div class="screen">${topbar('邀请 TA', {back:true})}<div class="scroll"><div class="pair-people"><div class="person">我</div><span class="link">×</span><div class="person ta">TA</div></div><h1 class="display" style="text-align:center;font-size:28px">我答完了，轮到 TA。</h1><p class="subtitle" style="text-align:center">对方将独立作答；只有双方完成，才会生成一份相处参考报告。</p><div class="paper-card invite-code" style="margin-top:25px"><span class="pill">一人一码 · 有效期后台配置</span><div class="code">8F29D</div><p>把配对码或邀请发给指定的 TA。对方完成后，你可以在记录里查看进度。</p><button class="btn" data-action="share-invite">分享给 TA</button><button class="text-btn" style="margin-top:8px" data-action="copy-code">复制配对码</button></div><div class="status-card paper-card"><h3>目前进度</h3><div class="pair-people" style="justify-content:flex-start;margin:11px 0 5px"><span class="pill green">我已完成</span><span class="pill">TA 待完成</span></div><p>不会显示对方的昵称、头像或逐题答案。</p></div></div><div class="detail-bottom"><button class="btn alt" data-action="pair-wait">查看配对进度</button></div></div>`; }
    function renderPairJoin() { const messages = { INVALID:'配对码无效，请检查后重新输入。', USED:'这个配对码已被使用，不能透露双方身份。', EXPIRED:'这个配对码已经失效，请让发起者重新创建。', VERSION_MISMATCH:'题型版本不一致，无法进入本次答题。请让发起者重新创建配对。' }; const reason = messages[state.pairStatus]; const bad = Boolean(reason); const retryable = state.pairStatus === 'INVALID'; return `<div class="screen">${topbar('加入双人测试', {back:true})}<div class="scroll"><div class="detail-cover pair" style="min-height:144px;font-size:51px">我×TA</div><span class="pill">双人独立作答</span><h1 class="display" style="font-size:27px">双人关系角色测试</h1><p class="subtitle">你将独立完成 30 道单选题。对方无法看到你的答案，双方完成后才会生成报告。</p><div class="divider"></div><label style="display:block;margin-bottom:8px;font-size:12px;font-weight:800">输入或粘贴配对码</label><div style="display:flex;gap:8px"><input class="input-box" id="pairCodeInput" value="${bad?'':'8F29D'}" maxlength="8" /><button class="btn small alt" data-action="clear-code">清空</button></div>${bad ? `<p class="notice">${reason}</p>` : `<p class="disclaimer" style="margin-top:11px">确认加入即进入答题；答题过程不展示广告或付费弹窗。</p>`}</div><div class="detail-bottom"><button class="btn" data-action="join-pair" ${bad&&!retryable?'disabled':''}>确认加入并开始答题</button></div></div>`; }

    function handleAction(el) {
      const a = el.dataset.action; if (!a) return;
      if (a === 'back') return back(); if (a === 'home') return go('home', {replace:true}); if (a === 'profile') return go('profile');
      if (a === 'agreement') { state.doc = el.dataset.doc; return go('agreement'); }
      if (a === 'accept-consent') { state.consented = true; return go('home', {replace:true}); }
      if (a === 'decline-consent') return toast('未同意协议，无法进入核心功能');
      if (a === 'retry-consent') { state.fault=null; return render(); }
      if (a === 'detail') return go('detail', {selected: el.dataset.test});
      if (a === 'start-test') return go('quiz', {resetQuiz:true});
      if (a === 'retry-home') { state.fault = null; return go('home',{replace:true}); }
      if (a === 'retry-detail') { state.fault = null; return render(); }
      if (a === 'category-filter') { state.activeCategory=el.dataset.category; return render(); }
      if (a === 'answer') { const no = state.quizIndex + 1; state.answers[no] = Number(el.dataset.option); if (no === state.selected.count) { state.isLastSelected = true; render(); } else { state.quizIndex++; render(); } return; }
      if (a === 'previous-question') { state.quizIndex = Math.max(0, state.quizIndex - 1); return render(); }
      if (a === 'exit-quiz') return openExitQuiz();
      if (a === 'save-exit') { document.querySelector('.overlay')?.remove(); toast('已暂存，可在下次继续'); return go('home',{replace:true}); }
      if (a === 'confirm-abandon') { document.querySelector('.overlay')?.remove(); return go('detail',{replace:true}); }
      if (a === 'submit-quiz') { if (state.selected.type === 'pair') return go('pair-invite',{replace:true}); return go('result',{replace:true}); }
      if (a === 'close-modal') return document.querySelector('.overlay')?.remove();
      if (a === 'share') return openShare(); if (a === 'share-invite') return openShare('invite'); if (a === 'confirm-share') { document.querySelector('.overlay')?.remove(); return toast('已调起微信原生分享（原型模拟）'); }
      if (a === 'copy-code') return toast('配对码已复制：8F29D');
      if (a === 'pair-wait') return go('pair-wait'); if (a === 'pair-another') return go('pair-invite');
      if (a === 'pair-status-action') { if (state.pairStatus === 'BOTH_DONE') return go('result',{replace:true}); if (state.pairStatus === 'EXPIRED') return go('detail',{selected:'pair',replace:true}); if (state.pairStatus === 'CANCELLED') return go('detail',{selected:'pair',replace:true}); if (state.pairStatus === 'INITIATOR_DONE') { state.pairStatus='PARTNER_JOINED'; render(); return toast('已刷新：对方正在作答'); } if (state.pairStatus === 'PARTNER_JOINED') { state.pairStatus='GENERATING'; render(); return toast('双方已完成，正在生成报告'); } if (state.pairStatus === 'GENERATING' || state.pairStatus === 'GENERATE_FAILED') { state.pairStatus='BOTH_DONE'; render(); return toast('已刷新：报告准备好了'); } }
      if (a === 'cancel-pair') { state.pairStatus='CANCELLED'; return render(); }
      if (a === 'join-pair') { const pairCode = document.getElementById('pairCodeInput')?.value.trim(); if (!pairCode) { state.pairStatus='INVALID'; return render(); } state.selected=tests.pair; state.pairStatus='PARTNER_JOINED'; return go('quiz',{resetQuiz:true}); }
      if (a === 'clear-code') { const input = document.getElementById('pairCodeInput'); if(input) input.value=''; return; }
      if (a === 'unlock-ad') return openAd(); if (a === 'ad-retry') { document.querySelector('.overlay')?.remove(); state.fault=null; return openAd(); } if (a === 'play-ad') return playAd();
      if (a === 'ad-complete') { document.querySelector('.overlay')?.remove(); state.deepUnlocked=true; state.fault=null; render(); return toast('服务端确认成功，深度内容已解锁'); }
      if (a === 'ad-interrupt') { document.querySelector('.overlay')?.remove(); return toast('未完整观看，深度内容仍保持锁定'); }
      if (a === 'member') { state.memberOrigin=state.screen; if (state.role==='visitor') return openLoginGate(); return go('member'); }
      if (a === 'login-continue') { document.querySelector('.overlay')?.remove(); state.role='free'; render(); return setTimeout(()=>go('member'), 180); }
      if (a === 'choose-plan') { state.activePlan=el.dataset.plan; document.querySelectorAll('.plan').forEach(p=>p.classList.toggle('active', p.dataset.plan===state.activePlan)); return; }
      if (a === 'buy-member') return openPayment();
      if (a === 'pay-success') { document.querySelector('.overlay')?.remove(); app.insertAdjacentHTML('beforeend', modal(`<h2>正在确认权益</h2><p>服务端确认中。确认完成后将返回原报告位置。</p><div class="sheet-actions"><button class="btn" data-action="confirm-entitlement">完成确认</button></div>`)); return; }
      if (a === 'confirm-entitlement') { document.querySelector('.overlay')?.remove(); state.role='member'; state.deepUnlocked=true; return go(state.memberOrigin || 'profile',{replace:true}); }
      if (a === 'pay-fail') { document.querySelector('.overlay')?.remove(); toast('支付未完成，已返回原流程；内容仍保持锁定'); return go(state.memberOrigin || 'profile',{replace:true}); }
      if (a === 'save-poster') return openPosterPermission(); if (a === 'allow-poster') { document.querySelector('.overlay')?.remove(); return toast('海报已保存（原型模拟）'); } if (a === 'deny-poster') { document.querySelector('.overlay')?.remove(); state.posterDenied=true; return openPosterPermission(); }
      if (a === 'retest') return openRetest(); if (a === 'confirm-retest') { document.querySelector('.overlay')?.remove(); return go('quiz',{resetQuiz:true,replace:true}); }
      if (a === 'history') return go('history'); if (a === 'record-tab') { state.recordTab=el.dataset.tab; return render(); } if (a === 'open-history-result') { state.selected=tests.work; return go('result'); } if (a === 'open-pair-result') { state.selected=tests.pair; return go('result'); }
      if (a === 'delete-report') return openDelete(el.dataset.kind); if (a === 'confirm-delete') { document.querySelector('.overlay')?.remove(); if (el.dataset.kind==='single') state.reportDeleted=true; else state.pairDeleted=true; render(); return toast('已从你的记录中移除'); }
      if (a === 'history-empty-cta') return state.recordTab==='single' ? go('home') : go('detail',{selected:'pair'});
      if (a === 'retry-history') { state.fault=null; return render(); }
      if (a === 'settings') return go('settings'); if (a === 'feedback') return go('feedback'); if (a === 'privacy') return go('privacy');
      if (a === 'submit-feedback') { const text = document.getElementById('feedbackText')?.value.trim() || ''; if (!text) { const n=document.getElementById('feedbackNotice'); if(n) n.textContent='请先填写反馈内容。'; return; } state.feedbackText=text; state.feedbackSubmitting=true; render(); setTimeout(() => { state.feedbackSubmitting=false; if(state.fault==='feedback-failure') { render(); toast('提交失败，已保留内容，可稍后重试'); return; } state.submittedFeedback=true; toast('反馈已提交'); go('settings',{replace:true}); }, 520); return; }
      if (a === 'retry-feedback') { state.fault=null; return render(); }
      if (a === 'show-protocol-version') return toast('当前已同意协议版本：V1.0'); if (a === 'show-data-usage') return toast('仅处理完成服务所需的最小数据');
      if (a === 'request-data-delete') { app.insertAdjacentHTML('beforeend', modal(`<h2>申请删除账号关联数据？</h2><p>请求将进入异步处理。完成后会刷新记录与结果页权限；处理期间可返回继续使用其他功能。</p><div class="sheet-actions"><button class="btn alt" data-action="close-modal">取消</button><button class="btn" data-action="confirm-data-delete">提交申请</button></div>`, 'dialog')); return; }
      if (a === 'confirm-data-delete') { document.querySelector('.overlay')?.remove(); toast('删除申请已提交，当前状态：处理中'); return; }
      if (a === 'version') return toast('心动测测 · V1.0 原型');
      if (a === 'restore-network') { state.fault=null; return render(); }
      if (a === 'toggle-lab') return lab.classList.toggle('mobile-open');
    }
    document.addEventListener('click', e => { const el = e.target.closest('[data-action]'); if (el) { e.preventDefault(); handleAction(el); } });
    document.querySelectorAll('[data-lab-role]').forEach(btn => btn.addEventListener('click', () => { state.role=btn.dataset.labRole; state.deepUnlocked=false; render(); toast(`已切换：${roleLabel()}`); }));
    document.querySelectorAll('[data-lab-screen]').forEach(btn => btn.addEventListener('click', () => { state.fault=null; if(btn.dataset.labTest) state.selected=tests[btn.dataset.labTest]; state.stack=[]; state.screen=btn.dataset.labScreen; if(state.screen==='pairjoin') state.pairStatus='INITIATOR_DONE'; render(); }));
    document.querySelectorAll('[data-lab-state]').forEach(btn => btn.addEventListener('click', () => { const s=btn.dataset.labState; state.stack=[]; state.deepUnlocked=false; state.feedbackSubmitting=false; if(s==='reset') { state.fault=null; state.pairStatus='INITIATOR_DONE'; state.posterDenied=false; state.screen='home'; } else if(s==='consent-failure') { state.fault=s; state.screen='consent'; } else if(s==='home-loading'||s==='home-failure'||s==='home-empty') { state.fault=s; state.screen='home'; } else if(s==='detail-offline') { state.fault=s; state.selected=tests.work; state.screen='detail'; } else if(s==='history-empty'||s==='history-failure') { state.fault=s; state.screen='history'; } else if(s==='offline') { state.fault='offline'; state.screen='home'; } else if(s==='answer-offline') { state.fault='offline-answer'; state.selected=tests.work; state.quizIndex=2; state.answers={1:0,2:1}; state.screen='quiz'; } else if(s==='ad-fail') { state.fault='ad-fail'; state.screen='result'; state.selected=tests.work; } else if(s==='permission') { state.posterDenied=true; state.fault=null; state.screen='result'; state.selected=tests.work; setTimeout(openPosterPermission,80); } else if(s==='content-offline') { state.fault='content-offline'; state.selected=tests.work; state.screen='result'; } else if(s==='payment-fail') { state.fault='payment-fail'; state.role='free'; state.memberOrigin='result'; state.screen='member'; setTimeout(openPayment,80); } else if(s==='feedback-failure') { state.fault='feedback-failure'; state.feedbackText='这里是已保留的反馈内容。'; state.screen='feedback'; } else if(s==='pair-invalid') { state.fault=null; state.pairStatus='INVALID'; state.screen='pairjoin'; } else if(s==='pair-expired') { state.fault=null; state.pairStatus='EXPIRED'; state.screen='pair-wait'; } else if(s==='pair-used') { state.fault=null; state.pairStatus='USED'; state.screen='pairjoin'; } else if(s==='pair-version') { state.fault=null; state.pairStatus='VERSION_MISMATCH'; state.screen='pairjoin'; } else if(s==='pair-report-fail') { state.fault=null; state.pairStatus='GENERATE_FAILED'; state.screen='pair-wait'; } render(); }));
    render();
  </script>
</body>
</html>
